<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>子芸的手繪插畫書房 OS v22</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #FBF7EE;
      --bg-card: #FFFDF8;
      --bg-subtle: #F4EDE0;
      --text-main: #2B2523;
      --text-muted: #7C7067;
      --border-col: #2B2523;
      --accent-gold: #FBE39C;
      --accent-mint: #D8ECE2;
      --accent-rose: #F9D5D8;
      --accent-sky: #E0F2FE;
      --accent-lav: #EDE9FE;
    }
    body.night-mode {
      --bg-page: #181622;
      --bg-card: #221F30;
      --bg-subtle: #2D2940;
      --text-main: #FFFFFF;
      --text-muted: #D4CCE6;
      --border-col: #8E84A8;
      color: #FFFFFF;
    }
    /* Global Night-Mode: All dark surfaces use crisp White text */
    body.night-mode .doodle-card,
    body.night-mode .doodle-subtle,
    body.night-mode header,
    body.night-mode main,
    body.night-mode section,
    body.night-mode table,
    body.night-mode th,
    body.night-mode td {
      color: #FFFFFF;
    }
    body.night-mode input,
    body.night-mode textarea,
    body.night-mode select {
      color: #FFFFFF;
    }
    body.night-mode select option {
      background-color: #221F30;
      color: #FFFFFF;
    }
    /* Translucent pastel tints over dark mode remain dark -> keep text White! */
    body.night-mode [class*="bg-[#FBE39C]/"]:not(.bg-white),
    body.night-mode [class*="bg-[#D8ECE2]/"]:not(.bg-white),
    body.night-mode [class*="bg-[#E0F2FE]/"]:not(.bg-white),
    body.night-mode [class*="bg-[#F9D5D8]/"]:not(.bg-white),
    body.night-mode [class*="bg-[#EDE9FE]/"]:not(.bg-white),
    body.night-mode [class*="bg-[#FED7AA]/"]:not(.bg-white),
    body.night-mode [class*="bg-amber-100/"],
    body.night-mode [class*="bg-rose-500/"] {
      color: #FFFFFF !important;
    }
    /* Solid opaque light/pastel surfaces keep dark #2B2523 text */
    body.night-mode .bg-white,
    body.night-mode [class*="bg-white/8"],
    body.night-mode [class*="bg-white/9"],
    body.night-mode .bg-\[\#FFFDF8\],
    body.night-mode .bg-\[\#FBE39C\],
    body.night-mode .bg-\[\#D8ECE2\],
    body.night-mode .bg-\[\#E0F2FE\],
    body.night-mode .bg-\[\#F9D5D8\],
    body.night-mode .bg-\[\#EDE9FE\],
    body.night-mode .bg-\[\#FED7AA\],
    body.night-mode .bg-\[\#06D6A0\],
    body.night-mode .bg-\[\#BAE6FD\],
    body.night-mode .bg-\[\#7DD3FC\],
    body.night-mode .bg-emerald-50,
    body.night-mode .bg-rose-100,
    body.night-mode .bg-amber-100,
    body.night-mode .bg-stone-200 {
      color: #2B2523 !important;
    }
    body.night-mode .bg-white input,
    body.night-mode .bg-white select,
    body.night-mode .bg-white textarea,
    body.night-mode .bg-\[\#FFFDF8\] input,
    body.night-mode .bg-\[\#FFFDF8\] select,
    body.night-mode .bg-\[\#FFFDF8\] textarea,
    body.night-mode .bg-\[\#FBE39C\] input,
    body.night-mode .bg-\[\#D8ECE2\] input,
    body.night-mode .bg-\[\#E0F2FE\] input,
    body.night-mode .bg-\[\#F9D5D8\] input,
    body.night-mode .bg-\[\#EDE9FE\] input {
      color: #2B2523 !important;
    }
    /* Override any hardcoded dark text classes on dark containers to White / Bright */
    body.night-mode .text-\[\#2B2523\] {
      color: #FFFFFF;
    }
    body.night-mode .bg-white .text-\[\#2B2523\],
    body.night-mode .bg-\[\#FFFDF8\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#FBE39C\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#D8ECE2\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#E0F2FE\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#F9D5D8\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#EDE9FE\] .text-\[\#2B2523\],
    body.night-mode .bg-\[\#06D6A0\] .text-\[\#2B2523\] {
      color: #2B2523 !important;
    }
    body.night-mode .doodle-card .text-emerald-800,
    body.night-mode .doodle-card .text-emerald-900,
    body.night-mode .doodle-card .text-emerald-700,
    body.night-mode .doodle-subtle .text-emerald-800,
    body.night-mode .doodle-subtle .text-emerald-900,
    body.night-mode .doodle-subtle .text-emerald-700 {
      color: #6EE7B7 !important;
    }
    body.night-mode .doodle-card .text-sky-900,
    body.night-mode .doodle-subtle .text-sky-900 {
      color: #7DD3FC !important;
    }
    body.night-mode .doodle-card .text-indigo-950,
    body.night-mode .doodle-subtle .text-indigo-950 {
      color: #DDD6FE !important;
    }
    body.night-mode .doodle-card .text-rose-800,
    body.night-mode .doodle-card .text-rose-900,
    body.night-mode .doodle-card .text-rose-700,
    body.night-mode .doodle-card .text-rose-600,
    body.night-mode .doodle-subtle .text-rose-800,
    body.night-mode .doodle-subtle .text-rose-700,
    body.night-mode .doodle-subtle .text-rose-600 {
      color: #FDA4AF !important;
    }
    body.night-mode .doodle-card .text-amber-900,
    body.night-mode .doodle-subtle .text-amber-900 {
      color: #FDE68A !important;
    }
    body.night-mode .doodle-card .text-stone-600,
    body.night-mode .doodle-subtle .text-stone-600,
    body.night-mode .doodle-card .text-stone-700,
    body.night-mode .doodle-subtle .text-stone-700 {
      color: #E7E5E4 !important;
    }
    body.night-mode .bg-\[\#2B2523\],
    body.night-mode .bg-rose-600 {
      color: #FFFFFF !important;
    }
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.35s ease, color 0.35s ease;
      word-break: keep-all;
      overflow-wrap: break-word;
      padding-bottom: max(3.5rem, env(safe-area-inset-bottom));
    }
    .doodle-card {
      background-color: var(--bg-card);
      border: 2.5px solid var(--border-col);
      box-shadow: 4px 4px 0px rgba(43, 37, 35, 0.14);
    }
    .doodle-subtle {
      background-color: var(--bg-subtle);
      border: 2px solid var(--border-col);
    }
    .doodle-pill {
      border: 1.8px solid var(--border-col);
      box-shadow: 2px 2px 0px rgba(43, 37, 35, 0.12);
    }
    table th, table td { white-space: nowrap; }
    button { touch-action: manipulation; }

    .scene-hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }
    .scene-hotspot:hover {
      background-color: rgba(251, 227, 156, 0.28);
      box-shadow: 0 0 0 2.5px #2B2523;
      z-index: 25;
    }
    .hotspot-pill {
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.16s ease, transform 0.16s ease;
      background: rgba(255, 253, 248, 0.96);
      color: #2B2523;
      border: 2px solid #2B2523;
      border-radius: 9999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 2px 2px 0px rgba(43, 37, 35, 0.2);
    }
    .scene-hotspot:hover .hotspot-pill,
    .show-hints .hotspot-pill {
      opacity: 1;
      transform: scale(1);
    }
    .night-dim {
      filter: brightness(0.76) contrast(1.06) sepia(0.08) hue-rotate(210deg);
      transition: filter 0.4s ease;
    }
    .warm-dim {
      filter: sepia(0.18) saturate(1.12);
      transition: filter 0.4s ease;
    }
    .room-scroll::-webkit-scrollbar { height: 6px; }
    .room-scroll::-webkit-scrollbar-thumb { background: #2B2523; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-[100dvh]">
  <!-- Top In-App Cross-Device Notification Banner -->
  <div id="inapp-alert-banner" class="hidden sticky top-0 z-50 bg-[#2B2523] text-[#FFFDF8] px-4 py-2.5 text-xs flex items-center justify-between gap-2 border-b-2 border-[#FBE39C]">
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-base shrink-0">🔔</span>
      <span id="inapp-alert-text" class="font-bold truncate">提醒通知</span>
    </div>
    <button id="inapp-alert-close" type="button" class="px-2.5 py-0.5 rounded-lg bg-[#FBE39C] text-[#2B2523] font-bold shrink-0">知道了</button>
  </div>

  <!-- Top Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md border-b-2 px-2.5 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs" style="background-color: var(--bg-card); border-color: var(--border-col);">
    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
      <button id="home-logo-btn" type="button" class="font-bold text-sm flex items-center gap-1 whitespace-nowrap shrink-0 hover:opacity-80" title="回到場景畫面"><span>🌸</span><span>子芸的手繪書房</span></button>

      <div class="relative shrink-0">
        <button id="overview-menu-btn" type="button" class="px-2.5 py-1 rounded-xl font-bold bg-[#FBE39C] text-[#2B2523] border-2 border-[#2B2523] flex items-center gap-1 whitespace-nowrap hover:bg-[#F9D5D8]">
          <span>📂 總覽選單</span><span>▾</span>
        </button>
        <div id="overview-dropdown" class="hidden absolute left-0 mt-1.5 w-80 max-w-[92vw] rounded-2xl doodle-card p-1.5 z-50 space-y-0.5 text-xs max-h-[75vh] overflow-y-auto">
          <div class="px-2.5 py-1 text-[10px] font-bold" style="color:var(--text-muted)">🌟 全局核心中樞（AI 管家・總日程・小賣部）</div>
          <button type="button" data-jump="home:gemini_ai" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-[#EDE9FE]/90 hover:bg-[#EDE9FE] font-bold">🤖 Gemini AI 智慧書房管家（資料問答 × 預覽確認改動）</button>
          <button type="button" data-jump="home:master_schedule" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-[#FBE39C]/50 hover:bg-amber-100/80 font-bold">🗓️ 全景總日程表（作業・考試複習・專案・課表・獎勵）</button>
          <button type="button" data-jump="home:reward_shop" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-[#F9D5D8]/50 hover:bg-amber-100/80 font-bold">🏪 靈感小賣部 & 逾期扣點/100%結算中心</button>
          <div class="border-t my-1" style="border-color: var(--border-col);"></div>
          <div class="px-2.5 py-1 text-[10px] font-bold" style="color:var(--text-muted)">🏠 生活健康與日常作業</div>
          <button type="button" data-jump="home:fridge" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-[#E0F2FE]/60 hover:bg-[#E0F2FE] font-bold">🍽️ 每日三餐 × 💧可愛水杯飲水 × ☕咖啡因整合中心</button>
          <button type="button" data-jump="home:calendar" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">📅 週期工作台（作業 & 日常活動代辦 × 習慣打卡）</button>
          <button type="button" data-jump="home:wallet" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">👛 韓系手帳理財中心（多帳戶・預算・存錢筒）</button>
          <button type="button" data-jump="home:body" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">⚖️ 減重體態管理 (59→50kg) & 運動紀錄</button>
          <button type="button" data-jump="home:bed" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🛏️ 床鋪睡眠計算（對比明日課表）</button>
          <button type="button" data-jump="home:music_focus" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">📻 白噪音播放器（雨聲/營火）& 番茄鐘</button>
          <button type="button" data-jump="home:notifications" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🔔 跨裝置通知欄推播設定</button>
          <div class="border-t my-1" style="border-color: var(--border-col);"></div>
          <div class="px-2.5 py-1 text-[10px] font-bold" style="color:var(--text-muted)">🏫 課業・考試複習・專題研究</div>
          <button type="button" data-jump="library:exams" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-[#D8ECE2]/70 hover:bg-[#D8ECE2] font-bold">📝 考試管理與 AI 科學化複習中心（小考/期中/證照）</button>
          <button type="button" data-jump="school:project_slides" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🚀 專題與研究計畫深度追蹤（含加權任務 × 論文精讀）</button>
          <button type="button" data-jump="school:schedule" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">📋 學期詳細課表管理（同步總日程表）</button>
          <button type="button" data-jump="home:study" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">📖 成績單規劃中心 & 畢業 128 學分檢核</button>
          <button type="button" data-jump="school:office_hours" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🙋‍♀️ 找教授 Office Hours 提問單 & 實驗工作台</button>
          <button type="button" data-jump="school:teachers" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🧑‍🏫 師長・同學・各界人脈資源圖鑑</button>
          <button type="button" data-jump="library:coding_tracker" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">💻 CPE 刷題技能樹 & 圖書館計時目標</button>
          <button type="button" data-jump="home:grad_goal" class="w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-amber-100/60 font-semibold">🏆 研究所目標牆・證照履歷 & 必帶書包清單</button></div>
      </div>

      <div class="hidden lg:flex items-center gap-1 p-0.5 rounded-xl doodle-subtle shrink-0">
        <button type="button" data-scene="home" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">🏠 房間</button>
        <button type="button" data-scene="school" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">🏫 教室</button>
        <button type="button" data-scene="library" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">📚 圖書館</button>
      </div>
    </div>

    <div class="flex items-center gap-1.5 flex-wrap">
      <div id="live-world-clock" class="px-2 py-1 rounded-xl doodle-subtle font-mono font-bold text-[11px] whitespace-nowrap shrink-0">2026/11/13 (週五) 12:26:00</div>
      <button id="header-gemini-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#EDE9FE] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="開啟 Gemini AI 智慧管家（可詢問任何事、連動修改資料並於確認後執行）">🤖 Gemini 助手 <span id="pending-ai-badge" class="hidden px-1.5 py-0.2 rounded-full bg-rose-600 text-white text-[10px]">0</span></button>
      <button id="header-exams-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#F9D5D8] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="開啟考試管理與 AI 科學化複習中心（小考/期中/期末/證照）">📝 考試複習</button>
      <button id="header-schedule-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#D8ECE2] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="開啟全景總日程表（代辦/專案/課表/約會/獎勵）">🗓️ 總日程表</button>
      <button id="header-shop-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#FBE39C] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="完成任務賺取靈感代幣，兌換看電影與放假獎勵">🏪 小賣部 <span id="token-badge-count">💡 0</span></button>
      <button id="cloud-sync-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#E0F2FE] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="登入 Google 帳號開啟 Firebase 雲端即時同步">☁️ 雲端登入</button>
      <button id="notif-center-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#F9D5D8] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="跨裝置通知設定">🔔 通知</button>
      <button id="toggle-hints-btn" type="button" class="px-2 py-1 rounded-xl doodle-subtle font-bold text-[11px] whitespace-nowrap shrink-0">💡 提示</button>
      <button id="direct-daynight-btn" type="button" class="px-2 py-1 rounded-xl doodle-subtle font-bold whitespace-nowrap shrink-0">☀️ 白日</button>
      <button id="download-html-btn" type="button" class="px-2.5 py-1 rounded-xl bg-[#D8ECE2] text-[#2B2523] border-2 border-[#2B2523] font-bold whitespace-nowrap shrink-0" title="下載 index.html 到手機/電腦部署">💾 下載 index.html</button>
      <button id="export-json-btn" type="button" class="px-2 py-1 rounded-xl doodle-subtle font-bold whitespace-nowrap shrink-0" title="匯出 JSON 備份">⬇️ 備份</button>
      <label class="px-2 py-1 rounded-xl doodle-subtle font-bold cursor-pointer whitespace-nowrap shrink-0">
        ⬆️ 匯入<input id="import-json-input" type="file" accept=".json" class="hidden" />
      </label>
    </div>
  </header>

  <main class="w-full max-w-[1600px] mx-auto px-3 sm:px-6 lg:px-8 pt-3 space-y-4">
    <!-- VIEW 1: PURE AI-ILLUSTRATED SCENE STAGE -->
    <div id="scene-view-container" class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 px-1">
        <div class="flex items-center gap-1 p-0.5 rounded-xl doodle-subtle text-xs shrink-0">
          <button type="button" data-scene="home" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">🏠 房間</button>
          <button type="button" data-scene="school" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">🏫 教室</button>
          <button type="button" data-scene="library" class="scene-tab px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">📚 圖書館</button>
        </div>
        <div class="flex items-center gap-2 text-[11px] font-bold" style="color:var(--text-muted)">
          <span id="week-badge-top" class="px-2.5 py-0.5 rounded-full bg-[#D8ECE2] text-[#2B2523] border border-[#2B2523]">📅 本週工作台</span>
          <span id="audio-mini-status" class="hidden px-2 py-0.5 rounded-full bg-[#FBE39C] text-[#2B2523] border border-[#2B2523]">🎵 白噪音播放中</span>
          <span>✨ 點擊物件切換至專屬全頁</span>

      // Helper for current Monday ISO string (YYYY-MM-DD) for weekly cycle auto-reset
      function getMondayISO(dInput) {
        const d = dInput ? new Date(dInput) : new Date();
        const day = d.getDay(); // 0=Sun, 1=Mon...
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(d.getFullYear(), d.getMonth(), diff);
        return `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
      }

      function getTodayISO() {
        const n = new Date();
        return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
      }

      // Smart Estimator: Auto-generates recommended duration (mins) based on task title/category/priority, and computes exact completion time!
      function autoEstimateTodoMins(text, cat, priority) {
        const s = String((text || '') + ' ' + (cat || '')).toLowerCase();
        if (s.includes('專題') || s.includes('論文') || s.includes('計畫') || s.includes('報告') || s.includes('海報')) return 120;
        if (s.includes('cpe') || s.includes('刷題') || s.includes('c++') || s.includes('程式') || s.includes('多益')) return 90;
        if (s.includes('預報') || s.includes('結報') || s.includes('作業') || s.includes('複習') || s.includes('實驗')) return 60;
        if (s.includes('買') || s.includes('繳') || s.includes('寄') || s.includes('確認') || s.includes('拿')) return 30;
        if (priority === '高') return 90;
        if (priority === '低') return 30;
        return 60;
      }

      function calcTodoEndTime(startStr, estMins) {
        const m = String(startStr || '18:00').match(/(\d{1,2}):(\d{2})/);
        const sh = m ? Number(m[1]) : 18;
        const sm = m ? Number(m[2]) : 0;
        const totMins = sh * 60 + sm + Number(estMins || 60);
        const eh = Math.floor(totMins / 60) % 24;
        const em = totMins % 60;
        const nextDay = totMins >= 1440 ? ' (跨日)' : '';
        return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}${nextDay}`;
      }

      // Compute Weighted Completion %, Category Breakdown, and Total Time Stats for a Deep Project
      function computeProjectStats(prj) {
        const cats = prj.categories || [
          { id: 'cat_lit', name: '📚 文獻與理論探討', weight: 25, color: '#E0F2FE' },
          { id: 'cat_exp', name: '💻 數據實驗與程式分析', weight: 30, color: '#D8ECE2' },
          { id: 'cat_doc', name: '✍️ 計畫書與論文撰寫', weight: 30, color: '#FBE39C' },
          { id: 'cat_pre', name: '🎨 海報簡報與送件審查', weight: 15, color: '#F9D5D8' }
        ];
        const tasks = prj.tasks || [];
        const papers = prj.papers || [];
        let totalWeight = 0;
        let weightedEarned = 0;

        const catStats = cats.map(c => {
          const w = Number(c.weight || 0);
          totalWeight += w;
          const cTasks = tasks.filter(t => t.catId === c.id);
          // If category is Literature (cat_lit) and has papers, also factor in paper reading progress!
          let ratio = 0;
          if (c.id === 'cat_lit' && (cTasks.length > 0 || papers.length > 0)) {
            const tDone = cTasks.filter(t => t.done).length;
            const pRatioSum = papers.reduce((s, p) => s + Math.min(1, Number(p.readPages||0) / Math.max(1, Number(p.totalPages||1))), 0);
            ratio = (tDone + pRatioSum) / Math.max(1, cTasks.length + papers.length);
          } else if (cTasks.length > 0) {
            ratio = cTasks.filter(t => t.done).length / cTasks.length;
          }
          const contrib = w * ratio;
          weightedEarned += contrib;
          return {
            ...c,
            totalTasks: cTasks.length,
            doneTasks: cTasks.filter(t => t.done).length,
            pct: Math.round(ratio * 100),
            contrib: +contrib.toFixed(1)
          };
        });

        // Fallback if no tasks exist in weighted categories yet
        let overallPct = totalWeight > 0 ? Math.round((weightedEarned / totalWeight) * 100) : 0;
        if (tasks.length === 0 && papers.length === 0) overallPct = Number(prj.pct || 0);

        const taskEstMins = tasks.reduce((s, t) => s + Number(t.estMins || 60), 0);
        const taskActualMins = tasks.reduce((s, t) => s + Number(t.actualMins || (t.done ? t.estMins : 0)), 0);
        const paperEstMins = papers.reduce((s, p) => s + Number(p.estMins || 90), 0);
        const paperSpentMins = papers.reduce((s, p) => s + Number(p.spentMins || 0), 0);

        return {
          overallPct: Math.min(100, overallPct),
          catStats,
          totalTasks: tasks.length,
          doneTasks: tasks.filter(t => t.done).length,
          totalPapers: papers.length,
          donePapers: papers.filter(p => Number(p.readPages||0) >= Number(p.totalPages||1) || p.stage === '已精讀並引用').length,
          totalEstMins: taskEstMins + paperEstMins,
          totalSpentMins: taskActualMins + paperSpentMins,
          taskEstMins,
          taskActualMins,
          paperEstMins,
          paperSpentMins
        };
      }

      // ==================== SCIENTIFIC EXAM REVIEW ENGINE (艾賓浩斯間隔重複 × 主動回憶) ====================
      function generateScientificExamPlan(exam) {
        const todayStr = getTodayISO();
        const tDate = new Date(todayStr + 'T00:00:00');
        const eDate = new Date((exam.examDate || todayStr) + 'T00:00:00');
        const daysLeft = Math.max(1, Math.round((eDate - tDate) / 86400000));
        const eType = exam.examType || '小考';
        const subj = exam.subject || exam.title || '考科';

        let freqLabel = '';
        let reason = '';
        let offsets = [];
        if (daysLeft <= 3) {
          freqLabel = '每 1 天（考前黃金高頻間隔）';
          reason = `距離考試僅剩 ${daysLeft} 天，依艾賓浩斯記憶保留曲線採用每日「主動回憶 → 錯題重算 → 考前睡眠鞏固」高頻循環，可大幅降低臨場遺忘率。`;
          for (let i = 0; i < daysLeft; i++) offsets.push(i);
        } else if (daysLeft <= 10) {
          freqLabel = '每 1~2 天（1-2-4 間隔衝刺法）';
          reason = `剩餘 ${daysLeft} 天最適合 1-2-4 天間隔重複節奏，每次複習間隔拉長以強化長期提取強度（Retrieval Strength）。`;
          offsets = [0, 1, 3, Math.max(4, daysLeft - 1)].filter((v, i, a) => v < daysLeft && a.indexOf(v) === i);
        } else {
          freqLabel = eType === '證照考' ? '每 2~3 天（雙軌間隔＋模擬實戰法）' : '每 3 天（艾賓浩斯 1-3-7 長期記憶法）';
          reason = `距離考試還有 ${daysLeft} 天，採用科學化「第1天建立架構 → 第3天主動回憶 → 第7天交錯刷題 → 考前2天限時模擬」最省時且不易倦怠。`;
          offsets = [0, 2, 5, 9, Math.max(10, daysLeft - 2)].filter((v, i, a) => v < daysLeft && a.indexOf(v) === i);
        }

        let method = '';
        if (/程式|C\+\+|CPE|演算法|資料結構/i.test(subj + exam.title)) {
          method = '1️⃣ 前 20 分鐘限時完成基礎題，訓練一次 AC 手感。\n2️⃣ 中段採「交錯練習」混做圖論、DP 與數論題。\n3️⃣ 卡關題必須隔 2 天與隔 7 天「蓋上解答重打一次」。';
        } else if (/英文|BESTEP|多益|TOEIC/i.test(subj + exam.title)) {
          method = '1️⃣ Shadowing 影子跟讀法訓練聽力反應與語調。\n2️⃣ 閱讀計時掃描關鍵句，減少逐字翻譯時間。\n3️⃣ 錯題與生字做成間隔回憶卡，睡前 15 分鐘複習。';
        } else if (/線性代數|離散數學|電路|通訊|微積分|數位/i.test(subj + exam.title)) {
          method = '1️⃣ 費曼白紙回憶法：合上課本默寫核心定義、定理或電路公式推導。\n2️⃣ 專攻作業與歷屆考古題錯題，標記卡關斷點。\n3️⃣ 搭配工程計算機限時驗算，確保計算精準度。';
        } else {
          method = '1️⃣ 先做「閉卷主動回憶」寫出章節大綱再對照筆記補漏。\n2️⃣ 採交錯練習不同題型，避免單一題型產生假性熟練。\n3️⃣ 考前 24 小時只看錯題本與關鍵架構並確保充足睡眠。';
        }

        const focusTemplates = [
          '第1輪（建立架構）：閉卷主動回憶核心章節與筆記盲點',
          '第2輪（錯題攻堅）：專攻作業／考古題錯題重算與推導',
          '第3輪（交錯實戰）：混合不同章節題型計時練習',
          '第4輪（限時模擬）：依正式考試時間進行模擬測驗',
          '第5輪（考前鞏固）：速覽高頻公式與易錯提示＋早睡鞏固'
        ];

        const sessions = offsets.map((off, idx) => {
          const d = new Date(tDate);
          d.setDate(d.getDate() + off);
          const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          return {
            id: 'RS' + Date.now() + '_' + idx,
            date: iso,
            time: idx % 2 === 0 ? '20:00' : '19:30',
            estMins: eType === '證照考' || eType === '期中考' ? 75 : 60,
            focus: focusTemplates[Math.min(idx, focusTemplates.length - 1)],
            done: false
          };
        });

        return { freqLabel, reason, method, sessions };
      }

      // ==================== OVERDUE DEADLINE PENALTY ENGINE (未於期限內完成自動扣靈感點數) ====================
      function getItemDeadlineInfo(item, type, parentPrj) {
        if (!item) return { deadlineDateObj: null, deadlineLabel: '', isOverdue: false, hoursLeft: 999 };
        const ps = state.penaltySettings || { enabled: true, deadlineMode: 'due_or_day_end' };
        let dStr = '';
        let label = '';
        if (type === 'todo') {
          if (item.hasDeadline && item.dueDate && /^\d{4}-\d{2}-\d{2}$/.test(item.dueDate)) {
            const dt = item.dueTime || '23:59';
            dStr = `${item.dueDate}T${dt}:00`;
            label = `繳交期限 ${item.dueDate} ${dt}`;
          } else if (ps.deadlineMode === 'strict_est_end') {
            const baseD = normDate(item.date);
            const endT = calcTodoEndTime(item.time || '18:00', item.estMins || 60);
            dStr = `${baseD}T${endT}:00`;
            label = `預計完成 ${baseD} ${endT}`;
          } else {
            const baseD = normDate(item.date);
            dStr = `${baseD}T23:59:59`;
            label = `當日限期 ${baseD} 23:59`;
          }
        } else if (type === 'ptask') {
          if (item.hasDeadline && item.dueDate && /^\d{4}-\d{2}-\d{2}$/.test(item.dueDate)) {
            const dt = item.dueTime || '23:59';
            dStr = `${item.dueDate}T${dt}:00`;
            label = `子任務期限 ${item.dueDate} ${dt}`;
          } else if (ps.deadlineMode === 'strict_est_end') {
            const baseD = normDate(item.date || (parentPrj && parentPrj.due));
            const endT = calcTodoEndTime(item.time || '14:00', item.estMins || 60);
            dStr = `${baseD}T${endT}:00`;
            label = `排程完成 ${baseD} ${endT}`;
          } else {
            const baseD = normDate(item.date || (parentPrj && parentPrj.due));
            dStr = `${baseD}T23:59:59`;
            label = `排程日限期 ${baseD} 23:59`;
          }
        } else if (type === 'project') {
          if (item.due && /^\d{4}-\d{2}-\d{2}$/.test(item.due)) {
            dStr = `${item.due}T23:59:59`;
            label = `計畫總截止 ${item.due} 23:59`;
          }
        } else if (type === 'goal') {
          if (item.deadline && /^\d{4}-\d{2}-\d{2}$/.test(item.deadline)) {
            dStr = `${item.deadline}T23:59:59`;
            label = `目標期限 ${item.deadline} 23:59`;
          }
        }
        if (!dStr) return { deadlineDateObj: null, deadlineLabel: '', isOverdue: false, hoursLeft: 999 };
        const dObj = new Date(dStr);
        if (isNaN(dObj.getTime())) return { deadlineDateObj: null, deadlineLabel: '', isOverdue: false, hoursLeft: 999 };
        const diffMs = dObj.getTime() - Date.now();
        const hoursLeft = +(diffMs / 3600000).toFixed(1);
        return {
          deadlineDateObj: dObj,
          deadlineLabel: label,
          isOverdue: diffMs < 0,
          hoursLeft
        };
      }

      function applyOverduePenalty(title, category, deductAmt, meta) {
        const ps = state.penaltySettings || { enabled: true, allowNegative: true };
        const deduct = Math.abs(Number(deductAmt || 10));
        const curTok = Number(state.inspirationTokens || 0);
        state.inspirationTokens = ps.allowNegative !== false ? (curTok - deduct) : Math.max(0, curTok - deduct);
        const now = new Date();
        const nowStamp = `${getTodayISO()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        if (!state.penaltyLogs) state.penaltyLogs = [];
        state.penaltyLogs.unshift({
          id: 'PEN' + Date.now() + Math.random().toString(36).slice(2,5),
          title,
          category,
          deadlineLabel: (meta && meta.deadlineLabel) || '',
          itemType: (meta && meta.itemType) || 'todo',
          itemId: (meta && meta.itemId) || '',
          projectId: (meta && meta.projectId) || '',
          penalizedAt: nowStamp,
          tokensDeducted: deduct,
          forgiven: false
        });
        if (!state.completedArchive) state.completedArchive = [];
        state.completedArchive.unshift({
          id: 'CA_PEN_' + Date.now() + Math.random().toString(36).slice(2,5),
          title: `⚠️ [逾期未完成扣點] ${title}`,
          category: `${category}（超過 ${meta && meta.deadlineLabel ? meta.deadlineLabel : '期限'}）`,
          completedAt: getTodayISO(),
          tokensEarned: -deduct
        });
        triggerNotification(`⚠️ 逾期未完成扣點！扣除 -${deduct} 💡靈感代幣`, `「${title}」未在期限內完成（${(meta && meta.deadlineLabel) || ''}），已自動扣除 ${deduct} 點靈感代幣！`);
      }

      function checkOverduePenalties(isManual) {
        if (!state.penaltySettings) state.penaltySettings = clone(INITIAL_STATE.penaltySettings);
        const ps = state.penaltySettings;
        if (!ps.enabled && !isManual) return 0;
        let newlyPenalized = 0;

        (state.todos || []).forEach(t => {
          if (t.done || t.penalized) return;
          const info = getItemDeadlineInfo(t, 'todo');
          if (info.isOverdue) {
            const amt = t.priority === '高' ? Number(ps.highPriorityTodoPenalty || 15) : Number(ps.todoPenalty || 10);
            t.penalized = true;
            t.penalizedAt = getTodayISO();
            t.penaltyAmount = amt;
            applyOverduePenalty(t.text, '代辦事項逾期', amt, { deadlineLabel: info.deadlineLabel, itemType: 'todo', itemId: t.id });
            newlyPenalized++;
          }
        });

        (state.deepProjects || []).forEach(prj => {
          const pst = computeProjectStats(prj);
          if (pst.overallPct < 100 && !prj.penalized) {
            const pInfo = getItemDeadlineInfo(prj, 'project');
            if (pInfo.isOverdue) {
              const pAmt = Number(ps.projectPenalty || 30);
              prj.penalized = true;
              prj.penalizedAt = getTodayISO();
              prj.penaltyAmount = pAmt;
              applyOverduePenalty(prj.title, '專題研究計畫總期限逾期', pAmt, { deadlineLabel: pInfo.deadlineLabel, itemType: 'project', itemId: prj.id });
              newlyPenalized++;
            }
          }
          (prj.tasks || []).forEach(pt => {
            if (pt.done || pt.penalized) return;
            const ptInfo = getItemDeadlineInfo(pt, 'ptask', prj);
            if (ptInfo.isOverdue) {
              const sAmt = Number(ps.subtaskPenalty || 15);
              pt.penalized = true;
              pt.penalizedAt = getTodayISO();
              pt.penaltyAmount = sAmt;
              applyOverduePenalty(`[${prj.title.slice(0,10)}] ${pt.title}`, '專案小任務逾期', sAmt, { deadlineLabel: ptInfo.deadlineLabel, itemType: 'ptask', itemId: pt.id, projectId: prj.id });
              newlyPenalized++;
            }
          });
        });

        (state.studyGoals || []).forEach(g => {
          if (Number(g.doneMins || 0) >= Number(g.targetMins || 1) || g.penalized) return;
          const gInfo = getItemDeadlineInfo(g, 'goal');
          if (gInfo.isOverdue) {
            const gAmt = Number(ps.goalPenalty || 20);
            g.penalized = true;
            g.penalizedAt = getTodayISO();
            g.penaltyAmount = gAmt;
            applyOverduePenalty(`讀書目標：${g.subj}`, '學習目標逾期', gAmt, { deadlineLabel: gInfo.deadlineLabel, itemType: 'goal', itemId: g.id });
            newlyPenalized++;
          }
        });

        if (newlyPenalized > 0) {
          saveState();
          renderAll();
        } else if (isManual) {
          toast('✅ 檢查完畢！目前所有未完成代辦、專案小任務與計畫皆在期限內，沒有新逾期項目！');
        }
        return newlyPenalized;
      }

      function executeConfirmedAiAction(actId) {
        const act = (state.pendingAiActions || []).find(a => a.id === actId);
        if (!act || act.status !== 'pending') return;

        const preSnapshot = JSON.stringify({
          todos: state.todos,
          deepProjects: state.deepProjects,
          inspirationTokens: state.inspirationTokens,
          penaltySettings: state.penaltySettings,
          financeTx: state.financeTx,
          scheduleEvents: state.scheduleEvents,
          courseTimetable: state.courseTimetable,
          bodyMetrics: state.bodyMetrics,
          habits: state.habits,
          diet: state.diet
        });

        const pl = act.payload || {};
        const type = act.actionType;

        if (type === 'add_todo') {
          state.todos.unshift({
            id: 'TD' + Date.now(),
            text: pl.text || 'AI 新增代辦事項',
            date: pl.date || getTodayISO(),
            time: pl.time || '19:00',
            estMins: Number(pl.estMins || 60),
            color: pl.color || '#E0F2FE',
            hasDeadline: !!pl.hasDeadline,
            dueDate: pl.dueDate || pl.date || getTodayISO(),
            dueTime: pl.dueTime || '23:59',
            cat: pl.cat || '課業',
            priority: pl.priority || '高',
            done: false
          });
        } else if (type === 'complete_todo') {
          const target = (state.todos || []).find(t => t.id === pl.id || (pl.keyword && t.text.includes(pl.keyword)));
          if (target) {
            settleCompletedItem(target.text, 'AI 協助完成一次性代辦結算', 15);
            state.todos = state.todos.filter(t => t.id !== target.id);
          }
        } else if (type === 'update_todo') {
          const target = (state.todos || []).find(t => t.id === pl.id || (pl.keyword && t.text.includes(pl.keyword)));
          if (target) {
            if (pl.newText) target.text = pl.newText;

      function parseNaturalDate(text) {
        const now = new Date();
        const addD = (n) => {
          const d = new Date(now);
          d.setDate(d.getDate() + n);
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        };
        if (text.includes('後天')) return addD(2);
        if (text.includes('明天') || text.includes('明日')) return addD(1);
        if (text.includes('今天') || text.includes('今日')) return addD(0);
        const mDate = text.match(/(202\d-\d{1,2}-\d{1,2})/);
        if (mDate) return normDate(mDate[1]);
        const mSlash = text.match(/(\d{1,2})[\/月](\d{1,2})/);
        if (mSlash) {
          const yr = now.getFullYear();
          return `${yr}-${String(mSlash[1]).padStart(2,'0')}-${String(mSlash[2]).padStart(2,'0')}`;
        }
        const wMap = {'週一':1,'星期一':1,'禮拜一':1,'週二':2,'星期二':2,'禮拜二':2,'週三':3,'星期三':3,'禮拜三':3,'週四':4,'星期四':4,'禮拜四':4,'週五':5,'星期五':5,'禮拜五':5,'週六':6,'星期六':6,'禮拜六':6,'週日':0,'星期日':0,'禮拜日':0,'週天':0};
        for (const [k, targetDay] of Object.entries(wMap)) {
          if (text.includes(k)) {
            let diff = (targetDay - now.getDay() + 7) % 7;
            if (diff === 0) diff = 7;
            return addD(diff);
          }
        }
        return getTodayISO();
      }

      function parseNaturalTime(text, fallback) {
        const mColon = text.match(/(\d{1,2}):(\d{2})/);
        if (mColon) return `${String(mColon[1]).padStart(2,'0')}:${mColon[2]}`;
        const mHr = text.match(/(早上|上午|中午|下午|晚上|凌晨)?\s*(\d{1,2})\s*點(半)?/);
        if (mHr) {
          let hr = Number(mHr[2]);
          const period = mHr[1] || '';
          const half = mHr[3] ? '30' : '00';
          if ((period === '下午' || period === '晚上') && hr < 12) hr += 12;
          if (period === '中午' && hr < 11) hr += 12;
          return `${String(hr).padStart(2,'0')}:${half}`;
        }
        return fallback || '19:00';
      }

            const act = createAiActionProposal({
              actionType: 'adjust_tokens',

              targetModule: '🏪 靈感代幣錢包 (state.inspirationTokens)',

                { field: '💡 靈感代幣餘額', before: `${cur} 💡`, after: `${nextVal} 💡` }
              ],
              payload: { mode: isSet ? 'set' : 'delta', value: nextVal, delta: isSub ? -num : num }
            });

            const tdList = (state.todos || []).map(t => {

          } else if (/(靈感|代幣|扣點|逾期|小賣部|獎勵)/.test(q)) {
            const ps = state.penaltySettings || {};
            replyLines.push(`💡 **目前靈感代幣與獎懲狀態：**\n- **目前擁有靈感代幣**：**${state.inspirationTokens || 0} 💡**\n- **自動逾期扣點機制**：**${ps.enabled !== false ? '🟢 已啟用' : '⚪ 已暫停'}**（一般代辦逾期 **-${ps.todoPenalty||10}💡**、高優先代辦 **-${ps.highPriorityTodoPenalty||15}💡**、專案小任務 **-${ps.subtaskPenalty||15}💡**、研究計畫總期限 **-${ps.projectPenalty||30}💡**）\n- **累計逾期扣點次數**：**${(state.penaltyLogs||[]).length} 次**\n- **目前可立即兌換的健康獎勵**：${(state.shopItems||[]).filter(s => Number(s.cost) <= Number(state.inspirationTokens||0)).map(s => `${s.icon}${s.title}(${s.cost}💡)`).join('、') || '再完成 1~2 項小任務即可兌換敷臉 SPA 或森林步道微旅行！'}`);
          } else if (/(錢|存款|餘額|預算|記帳|帳戶|花費)/.test(q)) {

          } else if (/(課表|上課|星期|週[一二三四五]|幾點上課|老師|教授)/.test(q)) {

            replyLines.push(`🏫 **這學期（115-1 大二上）課表與教室資訊：**\n${tList}`);
          } else {
            replyLines.push(`🤖 **我已收到你的提問：「${q}」**\n\n目前你的書房即時狀態摘要：\n- 💡 **靈感代幣**：**${state.inspirationTokens || 0} 點**（逾期自動扣點保護中）\n- ⏰ **待完成代辦**：**${(state.todos||[]).length} 項**（最近一項為「${state.todos[0] ? state.todos[0].text : '無'}」）\n- 🚀 **進行中專題計畫**：**${(state.deepProjects||[]).map(p => `${p.title}(${computeProjectStats(p).overallPct}%)`).join('、')}**\n- 💧 **今日飲水**：**${(state.bodyMetrics.waterCups||0)*250} / ${state.bodyMetrics.targetWaterMl||2500} ml**\n\n✨ **提示**：如果你想直接對系統做改動，可以輸入指令（例如：「*幫我新增代辦：明天晚上 8 點寫程式作業 90 分鐘*」、「*把海科計畫完整摘要標記完成*」、「*幫我記帳午餐 120 元*」），或者在上方填入 **Gemini API Key** 開啟雲端無限知識問答！`);

        }

        return {

      async function handleSendAiChat(userPromptText) {
        const text = (userPromptText || '').trim();
        if (!text) return;
        const nowStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        if (!state.aiChatMessages) state.aiChatMessages = [];
        state.aiChatMessages.push({
          id: 'MSG_U_' + Date.now(),
          role: 'user',
          time: nowStr,
          text,
          actionIds: []
        });
        saveState();
        renderAll();
        renderGeminiDrawerContent();

        const apiKey = (state.geminiConfig && state.geminiConfig.apiKey || '').trim();
        const modelName = (state.geminiConfig && state.geminiConfig.model) || 'gemini-2.5-flash';

        if (apiKey) {
          try {
            const liveContext = JSON.stringify(buildLiveOsContextSummary(), null, 2);
            const sysInstruction = `你是高科大電通系大二學生「黃子芸」專屬的智慧書房管家 Gemini AI。
你擁有她書房 OS 的完整即時資料：
${liveContext}

請嚴格遵守以下規則：
1. 用溫暖、清晰、條理分明的繁體中文回答她的問題（無論是查詢系統內的代辦、專案、論文、課表、成績、財務、減重飲水，或是解答大學專業科目如離散數學、線性代數、通訊原理、電路學、C++/CPE、CoastSat 遙測與 ACO 演算法）。
2. 【絕對安全規則】：當使用者要求「新增、修改、完成、刪除、記帳、調整點數或規則」時，你絕對不可以直接宣稱已經改好，而是要在回傳的 JSON 中將改動放入 proposedActions 陣列，系統會自動產生「改動前 vs 改動後」確認卡讓使用者點選確認後才執行！
3. 請務必回傳合法 JSON 格式（不要加 markdown code fence 以外的多餘文字）：
{
  "reply": "你的回答文字（若產生了 proposedActions，請在回覆中提醒她檢視下方的改動預覽卡並點選『✅ 確認執行改動』）",
  "proposedActions": [
    {
      "actionType": "add_todo | complete_todo | update_todo | delete_todo | add_project_task | complete_project_task | add_project_paper | add_schedule_event | add_finance_tx | adjust_tokens | update_penalty_rules | log_health",
      "title": "簡短動作標題",
      "targetModule": "目標模組名稱",
      "summary": "改動摘要說明",
      "diffRows": [
        { "field": "欄位名稱", "before": "改動前資料", "after": "改動後資料" }
      ],
      "payload": {
        "text": "代辦名稱", "title": "任務或記帳名稱", "date": "YYYY-MM-DD", "time": "HH:MM", "estMins": 90,
        "hasDeadline": true, "dueDate": "YYYY-MM-DD", "dueTime": "HH:MM", "id": "目標ID", "keyword": "關鍵字",
        "projectId": "PRJ01", "amount": 100, "txType": "expense", "mode": "delta", "delta": 10, "value": 50
      }
    }
  ]
}`;

            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: sysInstruction + "\n\n使用者最新提問或指令：" + text }] }],
                generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
              })
            });
            if (!resp.ok) throw new Error('API HTTP ' + resp.status);
            const data = await resp.json();
            const rawText = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] ? data.candidates[0].content.parts[0].text : '';
            let parsed = null;
            try {
              parsed = JSON.parse(rawText.replace(/^```json\s*/i, '').replace(/```$/i, '').trim());
            } catch (e) {
              parsed = { reply: rawText || '已完成分析。', proposedActions: [] };
            }
            const createdIds = [];
            (parsed.proposedActions || []).forEach(pa => {
              const act = createAiActionProposal(pa);
              createdIds.push(act.id);
            });
            state.aiChatMessages.push({
              id: 'MSG_A_' + Date.now(),
              role: 'assistant',
              time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }),
              text: parsed.reply || '已為你整理好回覆與改動預覽！',
              actionIds: createdIds
            });
            saveState();
            renderAll();
            renderGeminiDrawerContent();
            return;
          } catch (err) {
            const fallbackRes = runLocalSmartAgent(text);
            state.aiChatMessages.push({
              id: 'MSG_A_' + Date.now(),
              role: 'assistant',
              time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }),
              text: `*(Gemini API 連線提示：${err.message}，已自動切換為內建智慧語意代理為你處理)*\n\n` + fallbackRes.reply,
              actionIds: fallbackRes.actionIds
            });
            saveState();
            renderAll();
            renderGeminiDrawerContent();
            return;
          }
        }

        const res = runLocalSmartAgent(text);
        state.aiChatMessages.push({
          id: 'MSG_A_' + Date.now(),
          role: 'assistant',
          time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }),
          text: res.reply,
          actionIds: res.actionIds
        });
        saveState();
        renderAll();
        renderGeminiDrawerContent();
      }

      let audioCtx = null;
      let audioState = { playing: false, mode: null, volume: 0.35, nodes: [], lofiInterval: null };

      function getAudioCtx() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;

      function playChime() {
        if (!state.notifSettings || !state.notifSettings.sound) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.001, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.09 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + idx * 0.09); osc.stop(now + idx * 0.09 + 0.36);
          });
        } catch (e) {}
      }

      function stopAmbientAudio() {
        audioState.nodes.forEach(n => {
          try { if (n.stop) n.stop(); } catch (e) {}
          try { if (n.disconnect) n.disconnect(); } catch (e) {}
        });
        if (audioState.lofiInterval) { clearInterval(audioState.lofiInterval); audioState.lofiInterval = null; }
        audioState.nodes = []; audioState.playing = false; audioState.mode = null;
        const badge = document.getElementById('audio-mini-status');
        if (badge) badge.classList.add('hidden');
      }

      function startAmbientAudio(mode) {
        stopAmbientAudio();
        const ctx = getAudioCtx();
        if (!ctx) { toast('此瀏覽器不支援 Web Audio'); return; }
        const masterGain = ctx.createGain();
        masterGain.gain.value = audioState.volume;
        masterGain.connect(ctx.destination);
        audioState.nodes.push(masterGain);

        // Helper to build continuous looping noise buffer (rain, campfire base, wind, brown/pink/white)
        const createLoopLayer = (type, gainVal, filterType, freqVal, qVal) => {
          const bufferSize = 3 * ctx.sampleRate;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,lastOut=0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            if (type === 'pink') {
              b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520; b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
              b6 = white * 0.115926;
            } else if (type === 'brown') {
              output[i] = (lastOut + (0.02 * white)) / 1.02;
              lastOut = output[i];
              output[i] *= 2.5;
            } else if (type === 'crackle') {
              // Warm hearth rumble + random wood-popping impulses
              lastOut = (lastOut + (0.03 * white)) / 1.03;
              const pop = Math.random() < 0.0018 ? (Math.random() * 2 - 1) * 1.9 : 0;
              const sizzle = Math.random() < 0.015 ? (Math.random() * 2 - 1) * 0.45 : 0;
              output[i] = lastOut * 1.8 + pop + sizzle;
            } else {
              output[i] = white * 0.22;
            }
          }
          const src = ctx.createBufferSource();
          src.buffer = noiseBuffer;
          src.loop = true;
          const layerGain = ctx.createGain();
          layerGain.gain.value = gainVal;
          if (filterType) {
            const filt = ctx.createBiquadFilter();
            filt.type = filterType;
            filt.frequency.value = freqVal || 1000;
            if (qVal) filt.Q.value = qVal;
            src.connect(filt);
            filt.connect(layerGain);
          } else {
            src.connect(layerGain);
          }
          layerGain.connect(masterGain);
          src.start();
          audioState.nodes.push(src);
        };

        if (mode === 'rain') {
          createLoopLayer('pink', 0.85, 'bandpass', 1050, 0.65);
          createLoopLayer('brown', 0.40, 'lowpass', 320, 0.5);
        } else if (mode === 'campfire') {
          createLoopLayer('crackle', 0.95, 'lowpass', 2400, 0.7);
          createLoopLayer('brown', 0.45, 'lowpass', 220, 0.6);
        } else if (mode === 'rain_fire') {
          createLoopLayer('pink', 0.65, 'bandpass', 1000, 0.7);
          createLoopLayer('crackle', 0.85, 'lowpass', 2200, 0.7);
        } else if (mode === 'forest_wind') {
          createLoopLayer('pink', 0.70, 'lowpass', 620, 0.9);
          createLoopLayer('brown', 0.50, 'bandpass', 280, 1.2);
        } else if (mode === 'lofi' || mode === 'lofi_rain') {
          if (mode === 'lofi_rain') {
            createLoopLayer('pink', 0.42, 'bandpass', 1050, 0.7);
            createLoopLayer('crackle', 0.35, 'lowpass', 2000, 0.7);
          }
          const chords = [
            [261.63, 329.63, 392.00, 493.88],
            [220.00, 261.63, 329.63, 392.00],
            [174.61, 220.00, 261.63, 329.63],
            [196.00, 246.94, 293.66, 349.23]
          ];
          let step = 0;
          const playChord = () => {
            if (!audioState.playing) return;
            const freqs = chords[step % chords.length];
            step++;
            const now = ctx.currentTime;
            freqs.forEach((f, i) => {
              const osc = ctx.createOscillator(), g = ctx.createGain(), filt = ctx.createBiquadFilter();
              osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.04);
              filt.type = 'lowpass'; filt.frequency.setValueAtTime(820, now);
              g.gain.setValueAtTime(0.001, now + i * 0.04);
              g.gain.linearRampToValueAtTime(0.075, now + i * 0.04 + 0.15);
              g.gain.exponentialRampToValueAtTime(0.001, now + 2.3);
              osc.connect(filt); filt.connect(g); g.connect(masterGain);
              osc.start(now + i * 0.04); osc.stop(now + 2.35);
            });
          };
          audioState.playing = true; audioState.mode = mode;
          playChord(); audioState.lofiInterval = setInterval(playChord, 2400);
        } else if (mode === 'pink') {
          createLoopLayer('pink', 0.85, null);
        } else if (mode === 'brown') {
          createLoopLayer('brown', 0.85, null);
        } else {
          createLoopLayer('white', 0.75, null);
        }

        audioState.playing = true;
        audioState.mode = mode;
        const modeNames = {
          rain: '🌧️ 窗邊午後細雨',
          campfire: '🔥 溫暖劈啪營火',
          rain_fire: '🏕️ 雨夜木屋營火混音',
          forest_wind: '🌲 森林微風與溪流',
          lofi_rain: '🎧 雨聲＋Lo-fi 電鋼琴循環',
          lofi: '🎹 柔和 Lo-fi 電鋼琴循環',
          pink: '🌸 粉紅噪音',
          brown: '🤎 棕噪音',
          white: '🤍 純淨白噪音'
        };
        const badge = document.getElementById('audio-mini-status');
        if (badge) {
          badge.classList.remove('hidden');
          badge.textContent = `🎵 內建循環中：${modeNames[mode] || mode}`;
        }
      }

      function triggerNotification(title, body) {

        if ('Notification' in window && Notification.permission === 'granted') {
          try {

          const [hh, mm] = (ev.time || '09:00').split(':');
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:ziyun-os-v14-${idx}@local`);
          lines.push(`DTSTART:${ymd}T${hh}${mm}00`);
          lines.push(`DTEND:${ymd}T${hh}${mm}00`);

          lines.push(`SUMMARY:${ev.title}`);
          lines.push('BEGIN:VALARM');
          lines.push('TRIGGER:-PT0M');
          lines.push('ACTION:DISPLAY');
          lines.push(`DESCRIPTION:${ev.title}`);
          lines.push('END:VALARM');
          lines.push('END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });

      function checkScheduledNotifications() {
        checkDailyAndWeeklyRollover();
        const ns = state.notifSettings;
        if (!ns || !ns.enabled) return;
        const now = new Date();
        const todayStr = getTodayISO();
        const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const dayIdx = (now.getDay() + 6) % 7; // Mon=0 .. Sun=6

        if (hhmm !== lastNotifMinute) {
          lastNotifMinute = hhmm;

          // 1. Meal & Routine Reminders
          if (ns.mealReminders) {
            if (hhmm === ns.breakfastTime) triggerNotification('🍳 早餐時間到！', '記得輸入早餐吃了什麼與維生素攝取喔！');
            if (hhmm === ns.lunchTime) triggerNotification('🍱 午餐時間到！', '記得輸入午餐內容，保持 1345 kcal 減重目標！');
            if (hhmm === ns.dinnerTime) triggerNotification('🥗 晚餐時間到！', '記得紀錄晚餐與蛋白質攝取量！');
          }
          if (hhmm === ns.dailyFinanceTime) triggerNotification('👛 每日記帳時間', '花 30 秒記下今天的花費，守住本月預算！');
          if (hhmm === ns.bedTime) triggerNotification('🌙 準備睡覺囉！', '點擊床鋪可對比明日第一堂課計算睡眠時數。');

          // 2. Timed To-Do Reminders (Fires to Device Notification Bar when time matches!)
          state.todos.forEach(td => {
            if (!td.done && td.time === hhmm && (!td.date || td.date === todayStr)) {
              triggerNotification(`⏰ 代辦事項提醒 (${td.time})`, `${td.text} [${td.cat || '待辦'}]`);
            }
          });

          // 3. Timed Habit Reminders (If today's habit is not checked yet)
          state.habits.forEach(hb => {
            if (hb.reminderTime === hhmm && !(hb.days && hb.days[dayIdx])) {
              triggerNotification(`✨ 本週習慣打卡提醒 (${hb.reminderTime})`, `今天還沒打卡「${hb.name}」喔！完成後記得打勾！`);
            }
          });

        if (ns.waterIntervalMins > 0 && (Date.now() - lastWaterAlertTs) >= ns.waterIntervalMins * 60 * 1000) {

      }

      function to43(score) {
        if (score === null || score === undefined || score === '') return 0;
        const s = Number(score);
        if (s >= 90) return 4.3; if (s >= 85) return 4.0; if (s >= 80) return 3.7;
        if (s >= 77) return 3.3; if (s >= 73) return 3.0; if (s >= 70) return 2.7;
        if (s >= 67) return 2.3; if (s >= 63) return 2.0; if (s >= 60) return 1.7;
        return 0.0;
      }
      function toLetter(score) {
        if (score === null || score === undefined || score === '') return '-';
        const s = Number(score);
        if (s >= 90) return 'A+'; if (s >= 85) return 'A'; if (s >= 80) return 'A-';
        if (s >= 77) return 'B+'; if (s >= 73) return 'B'; if (s >= 70) return 'B-';
        if (s >= 67) return 'C+'; if (s >= 63) return 'C'; if (s >= 60) return 'C-';
        return 'F';
      }

      function computeTranscriptStats() {
        const doneCourses = state.courses.filter(c => c.status === '已修畢' && Number(c.credits) > 0 && c.score !== null && c.score !== '');
        const activeCourses = state.courses.filter(c => c.status === '修習中' && Number(c.credits) > 0);
        const pool = state.courses.filter(c => ['已修畢','修習中'].includes(c.status) && Number(c.credits) > 0 && c.score !== null && c.score !== '');

        const doneCred = state.courses.filter(c => c.status === '已修畢').reduce((s, c) => s + Number(c.credits), 0);
        const activeCred = state.courses.filter(c => c.status === '修習中').reduce((s, c) => s + Number(c.credits), 0);

        const doneWAvg = doneCred ? +(doneCourses.reduce((s, c) => s + Number(c.credits) * Number(c.score), 0) / doneCred).toFixed(2) : 0;
        const doneGpa43 = doneCred ? +(doneCourses.reduce((s, c) => s + Number(c.credits) * to43(c.score), 0) / doneCred).toFixed(2) : 0;

        const totCred = pool.reduce((s, c) => s + Number(c.credits), 0);
        const wAvg = totCred ? +(pool.reduce((s, c) => s + Number(c.credits) * Number(c.score), 0) / totCred).toFixed(2) : 0;
        const gpa43 = totCred ? +(pool.reduce((s, c) => s + Number(c.credits) * to43(c.score), 0) / totCred).toFixed(2) : 0;
        return { pool, totCred, wAvg, gpa43, doneCred, activeCred, doneWAvg, doneGpa43 };
      }
